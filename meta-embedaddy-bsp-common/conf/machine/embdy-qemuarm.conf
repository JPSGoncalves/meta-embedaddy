require conf/machine/qemuarm.conf

PREFERRED_PROVIDER_virtual/kernel = "linux-embdy-mainline"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-embdy"

UBOOT_EXTLINUX = "1"
UBOOT_EXTLINUX_LABELS = "embdy"
UBOOT_EXTLINUX_MENU_DESCRIPTION:embdy = "EmbeDaddy"
UBOOT_EXTLINUX_KERNEL_IMAGE = "../${KERNEL_IMAGETYPE}"
UBOOT_EXTLINUX_ROOT = "root=/dev/vda2"
UBOOT_EXTLINUX_CONSOLE = "console=ttyAMA0,115200"

# QEMU's virt machine generates the device tree and hands it to U-Boot, so
# emitting neither FDT nor FDTDIR makes U-Boot pass $fdtcontroladdr straight
# through to Linux. A real board sets one of these to its .dtb.
UBOOT_EXTLINUX_FDT = ""
UBOOT_EXTLINUX_FDTDIR = ""

IMAGE_FSTYPES += "wic"
WKS_FILE = "embdy-sdimage.wks"
IMAGE_BOOT_FILES = "${KERNEL_IMAGETYPE} extlinux.conf;extlinux/extlinux.conf"

QB_DEFAULT_BIOS = "u-boot.bin"
QB_DEFAULT_FSTYPE = "wic"
QB_ROOTFS_OPT = "-drive id=disk0,file=@ROOTFS@,if=none,format=raw -device virtio-blk-device,drive=disk0"
QB_KERNEL_ROOT = ""
