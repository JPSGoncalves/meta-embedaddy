MACHINEOVERRIDES =. "stm32mpcommon:stm32mp1common:stm32mp15common:"

DEFAULTTUNE = "cortexa7thf-neon-vfpv4"
require conf/machine/include/arm/armv7a/tune-cortexa7.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-stm32mp"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-stm32mp"
PREFERRED_PROVIDER_virtual/trusted-firmware-a = "tf-a-stm32mp"
PREFERRED_PROVIDER_virtual-optee-os = "optee-os-stm32mp"
PREFERRED_PROVIDER_u-boot-fw-utils = "libubootenv"

# Machine Configuration
SERIAL_CONSOLES = "115200;ttySTM0"
MACHINE_FEATURES = "usbhost usbgadget alsa screen ext2 watchdog fip"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = "kernel-imagebootfs u-boot-stm32mp-extlinux u-boot-fw-config-embdy"
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS = "kernel-modules"

# ST Configuration
STM32MP_SOC_NAME = "stm32mp15"
## Only use in source DT
EXTERNAL_DT_ENABLED = "0"
## ST only variable to centralize (in source and external) DT for each different support
## and software project (TF-A, OP-TEE, U-Boot and Linux)
STM32MP_DT_FILES_SDCARD="stm32mp157f-dk2"
STM32MP_DEVICETREE = "stm32mp157f-dk2"

# TF-A Configuration
TF_A_CONFIG = "opteemin-sdcard"
TF_A_TOOLS_PLATFORM ?= "stm32mp2"
ST_TF_A_DEBUG_TRACE ?= "0"

# OP-TEE Configuration
OPTEE_CONFIG = "opteemin"
ST_OPTEE_DEBUG_TRACE ?= "0"

# U-Boot Configuration
UBOOT_CONFIG = "default_stm32mp15"
## Avoid quiet console
ST_UBOOT_DEBUG_TRACE = "1"

# U-Boot Extlinux
UBOOT_EXTLINUX = "1"
UBOOT_EXTLINUX_LABELS = "embdy"
UBOOT_EXTLINUX_MENU_DESCRIPTION:embdy = "Linux STM32MP157F-DK2"
UBOOT_EXTLINUX_KERNEL_IMAGE = "../${KERNEL_IMAGETYPE}"
UBOOT_EXTLINUX_FDT = "../stm32mp157f-dk2.dtb"
UBOOT_EXTLINUX_FDTDIR = ""
UBOOT_EXTLINUX_ROOT = "root=PARTUUID=257bf3ad-3d89-4b5c-844d-3bbeff52d92f"
UBOOT_EXTLINUX_CONSOLE = "console=ttySTM0,115200"
UBOOT_EXTLINUX_KERNEL_ARGS = "rootwait rw"

# Kernel Configuration
KERNEL_SUB_PATH = "st/"
KERNEL_DEVICETREE = "st/stm32mp157f-dk2.dtb"
KERNEL_IMAGETYPE = "uImage"
KERNEL_CLASSES = "kernel-uimage"
ST_KERNEL_LOADADDR = "0xC2000040"
UBOOT_ENTRYPOINT = "0xC4000000"

# FIP Configutation
# FIP = OP-TEE + U-Boot + DTBs. The flag has no recipe-side default.
# Fields: <BL32 type>,<DTB>,<DTB suffix>,<u-boot conf>:<optee conf>
FIP_CONFIG = "opteemin-sdcard"
FIP_CONFIG[opteemin-sdcard] = "optee,${STM32MP_DT_FILES_SDCARD},,default:opteemin"
FIP_BL31_ENABLE = "0"
SIGN_ENABLE = "0"
ENCRYPT_ENABLE = "0"

# Image Configuration
IMAGE_FSTYPES += "wic"
WKS_FILE = "embdy-stm32mp157f-dk2.wks"
EXTRA_IMAGEDEPENDS += "virtual/trusted-firmware-a fip-stm32mp"
WKS_FILE_DEPENDS:append = " virtual/trusted-firmware-a fip-stm32mp"

# STM32 USB Programmer (Recovery and Flash) Configuration
STM32MP_DEVICETREE_PROGRAMMER = "stm32mp157f-dk2"
TF_A_CONFIG += "opteemin-programmer-usb"
OPTEE_CONFIG += "opteemin-programmer"
UBOOT_CONFIG += "programmer_stm32mp15"
FIP_CONFIG += "opteemin-programmer-usb"
FIP_CONFIG[opteemin-programmer-usb] = "optee,stm32mp157f-dk2,,programmer:opteemin-programmer-usb:opteemin-programmer,usb"

IMAGE_CLASSES += "flashlayout-stm32mp"
# flashlayout-stm32mp's anonymous python does getVarFlags('PARTITIONS_IMAGES').pop('doc'),
# which needs at least one flag. We build no separate partition images.
PARTITIONS_IMAGES = ""
PARTITIONS_IMAGES[doc] = "Partition images for ST's flashlayout generator; unused, static TSVs only"
# Its do_create_flashlayout_config[vardeps] splits DEVICE_STORAGE_NAMES, which
# only ST's st-machine-storage-device-stm32mp.inc defines (EMMC NAND NOR SDCARD ...).
# Nothing else in meta-st reads it; static mode needs no per-storage overrides.
DEVICE_STORAGE_NAMES = ""
# The class's flashlayout_partition_config prefunc runs even in static mode:
# it fatals on empty FLASHLAYOUT_BOOTSCHEME_LABELS and pops a flag off
# FLASHLAYOUT_CONFIG_LABELS. Neither value is used by the static copy.
FLASHLAYOUT_BOOTSCHEME_LABELS = "opteemin"
FLASHLAYOUT_CONFIG_LABELS = ""
FLASHLAYOUT_CONFIG_LABELS[doc] = "Dynamic flashlayout configs; unused, static TSVs only"
ENABLE_FLASHLAYOUT_DEFAULT = "1"
FLASHLAYOUT_DEPEND_TASKS = "virtual/trusted-firmware-a:do_deploy fip-stm32mp:do_deploy"
FLASHLAYOUT_DEFAULT_SRC = " \
  flashlayouts/FlashLayout_sdcard-raw_embdy-stm32mp157f-dk2.tsv \
"
