MACHINEOVERRIDES =. "stm32mpcommon:stm32mp1common:stm32mp15common:"

DEFAULTTUNE = "cortexa7thf-neon-vfpv4"
require conf/machine/include/arm/armv7a/tune-cortexa7.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-stm32mp"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-stm32mp"
PREFERRED_PROVIDER_virtual/trusted-firmware-a = "tf-a-stm32mp"
PREFERRED_PROVIDER_virtual-optee-os = "optee-os-stm32mp"
PREFERRED_PROVIDER_u-boot-fw-utils = "libubootenv"

# Machine Configuration
SERIAL_CONSOLES = "115200;ttySTM0"
MACHINE_FEATURES = "usbhost usbgadget alsa screen ext2 watchdog fip"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = "kernel-imagebootfs u-boot-stm32mp-extlinux u-boot-fw-config-embdy"
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS = "kernel-modules"

# ST DT Configuration
## Only use in source DT
EXTERNAL_DT_ENABLE="0"
## ST only variable to centralize (in source and external) DT for each different support
## and software project (TF-A, OP-TEE, U-Boot and Linux)
STM32MP_DT_FILES_SDCARD="stm32mp157f-dk2"
STM32MP_DEVICETREE = "stm32mp157f-dk2"

# TF-A Configuration
TF-A_CONFIG = "optee-min"
ST_TF_A_DEBUG_TRACE ?= "1"

# OP-TEE Configuration
OPTEE_CONFIG = "opteemin"
ST_OPTEE_DEBUG_TRACE ?= "1"

# U-Boot Configuration
UBOOT_CONFIG = "default_stm32mp15"
## Avoid quiet console
ST_UBOOT_DEBUG_TRACE = "1"

# U-Boot Extlinux
UBOOT_EXTLINUX = "1"
UBOOT_EXTLINUX_LABELS = "embdy"
UBOOT_EXTLINUX_MENU_DESCRIPTION:embdy = "Linux STM32MP157F-DK2"
UBOOT_EXTLINUX_KERNEL_IMAGE = "../${KERNEL_IMAGETYPE}"
UBOOT_EXTLINUX_FDT = "../stm32mp157f-dk2.dtb"
UBOOT_EXTLINUX_FDTDIR = ""
UBOOT_EXTLINUX_ROOT = "root=PARTUUID=257bf3ad-3d89-4b5c-844d-3bbeff52d92f"
UBOOT_EXTLINUX_CONSOLE = "console=ttySTM0,115200"
UBOOT_EXTLINUX_KERNEL_ARGS = "rootwait rw"

# Kernel Configuration
KERNEL_SUB_PATH = "st/"
KERNEL_DEVICETREE = "st/stm32mp157f-dk2.dtb"
KERNEL_IMAGETYPE = "uImage"
KERNEL_CLASSES = "kernel-uimage"
ST_KERNEL_LOADADDR = "0xC2000040"
UBOOT_ENTRYPOINT = "0xC4000000"

# FIP Configutation

# Image Configuration
IMAGE_FSTYPES += "wic"
WKS_FILE = "embdy-stm32mp157f-dk2.wks.in"
EXTRA_IMAGEDEPENDS += "virtual/trusted-firmware-a fip-stm32mp"
WKS_FILE_DEPENDS:append = " virtual/trusted-firmware-a fip-stm32mp"
