# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-embedaddy-bsp-st"
BBFILE_PATTERN_meta-embedaddy-bsp-st = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-embedaddy-bsp-st = "8"

LAYERDEPENDS_meta-embedaddy-bsp-st = "core"
LAYERSERIES_COMPAT_meta-embedaddy-bsp-st = "scarthgap"
